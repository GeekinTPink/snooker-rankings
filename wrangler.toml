# Cloudflare Worker + static assets（OpenNext）
# https://opennext.js.org/cloudflare/get-started
name = "snooker-rankings"
main = ".open-next/worker.js"
compatibility_date = "2026-03-22"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# 与 name 一致，用于 ISR/队列等自引用 fetch
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "snooker-rankings"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "snooker-users-db"
database_id = "1fc92714-3b16-4d5e-a90c-6bfcb8d68ea7"

# 环境变量配置
# SEO: set NEXT_PUBLIC_SITE_URL=https://your-domain.com for absolute canonical, sitemap.xml, and OG URLs.
[vars]
PAYPAL_MODE = "live"
PAYPAL_CLIENT_ID = "AUQ5KDrY9gP2vs1LNLcaTOnwNVve4s-oASpwxOnZRepgIBaOXzw81KAAG43ak8GgQ_WAMK7XKydy9TEO"
PAYPAL_CLIENT_SECRET = "EFeNW962ZUSXUuknVnqGUh-Jbr-RvH-b8xtAdXkQlesG8kYvycGrHhKQG4zagbzeivB8lxmiRFWNoM8S"
NEXT_PUBLIC_PAYPAL_CLIENT_ID = "AUQ5KDrY9gP2vs1LNLcaTOnwNVve4s-oASpwxOnZRepgIBaOXzw81KAAG43ak8GgQ_WAMK7XKydy9TEO"

# 若启用 R2 增量缓存，参见 https://opennext.js.org/cloudflare/caching
# [[r2_buckets]]
# binding = "NEXT_INC_CACHE_R2_BUCKET"
# bucket_name = "snooker-rankings-opennext-cache"

# 若使用 Next 图片优化，参见 https://opennext.js.org/cloudflare/howtos/image
# [images]
# binding = "IMAGES"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
